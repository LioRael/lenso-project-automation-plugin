[workspace]
resolver = "2"
members = [
    "crates/lenso-capability-project-automation",
    "crates/lenso-project-automation-agent-tools-plugin",
    "crates/lenso-project-automation-postgres-plugin",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = true
repository = "https://github.com/LioRael/lenso-project-automation-plugin"
rust-version = "1.94"

[workspace.dependencies]
futures = "0.3"
lenso = "0.5.0"
lenso-app-plan = "0.3.0"
lenso-capability-agent-tool-provider = "0.1.0"
lenso-auth-sdk = "0.2.1"
lenso-capability-access-control = "0.1.0"
lenso-capability-jobs = "=0.1.2"
lenso-capability-organization-membership = "0.1.0"
lenso-capability-projects = "0.1.0"
lenso-capability-projects-collaboration = "0.1.0"
lenso-capability-secrets = "0.1.1"
lenso-contract-codegen = "0.6.3"
lenso-contract-runtime = "0.1.3"
lenso-kernel = "0.2.0"
lenso-native-adapter = "0.3.0"
lenso-plugin-authoring = "0.1.1"
lenso-postgres-kit = "0.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "json", "time", "uuid"] }
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.52", features = ["macros", "rt", "rt-multi-thread"] }
uuid = { version = "1.18", features = ["v4", "v5", "serde"] }
zeroize = "1.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
