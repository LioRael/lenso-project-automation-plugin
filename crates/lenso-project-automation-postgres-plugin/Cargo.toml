lenso-capability-projects.workspace = true
lenso-capability-projects-collaboration.workspace = true
lenso-capability-secrets.workspace = true
lenso-kernel.workspace = true
lenso-postgres-kit.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
futures.workspace = true
lenso-app-plan.workspace = true
lenso-native-adapter.workspace = true
tokio.workspace = true

[lints]
workspace = true
